name: Build

# Every push and PR is built and tested. A GitHub Release is published only for
# a version tag (e.g. 1.5.1, no "v": the in-app updater looks releases up by the
# bare version) or a manual run with a version.
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, e.g. 1.5.1 (empty: build and test only)'
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --max-warnings 0
      - run: pnpm typecheck

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: windows-latest, platform: win, arch: arm64 }
          # macos-latest (macOS 26) breaks electron-builder keychain setup
          - { os: macos-15, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # Builds runner/ (the elevated-start helper), Windows only
      - if: matrix.platform == 'win'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/set-version.sh

      - name: Install and fetch cores
        run: |
          SKIP_PREPARE=1 pnpm install --frozen-lockfile
          pnpm prepare --${{ matrix.arch }}

      - name: Build
        env:
          # All signing secrets are optional; see docs/RELEASING.md
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = win ] && [ -n "$WIN_CSC_LINK" ]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          if [ "${{ matrix.platform }}" = mac ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              if [ -n "$APPLE_API_KEY_P8" ]; then
                export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
                printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
                extra+=(-c.mac.notarize=true)
              fi
            else
              # No certificate: ad-hoc signature, without it Apple Silicon refuses to run the app
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              extra+=(-c.mac.identity=-)
            fi
          fi
          pnpm exec electron-vite build
          pnpm exec electron-builder --publish never --${{ matrix.platform }} --${{ matrix.arch }} "${extra[@]}"

      # The app keeps its data next to the exe when a PORTABLE file is present
      - name: Mark portable archive
        if: matrix.platform == 'win'
        run: |
          touch PORTABLE
          for f in dist/*-portable.7z; do 7z a "$f" PORTABLE; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/r00tvpn_*
            !dist/*.blockmap

  e2e-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package: [deb, appimage]
    runs-on: ubuntu-24.04
    name: E2E linux-x64 ${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # Only playwright-core is needed to drive the packaged app
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-linux-x64
          path: dist
      - name: Install test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 dconf-service dconf-gsettings-backend gsettings-desktop-schemas libfuse2t64
      - name: Install deb
        if: matrix.package == 'deb'
        run: |
          sudo apt-get install -y ./dist/r00tvpn_amd64.deb
          echo "APP=/opt/r00tvpn/r00tvpn" >> "$GITHUB_ENV"
      - name: Prepare AppImage
        if: matrix.package == 'appimage'
        run: |
          chmod +x dist/r00tvpn_x86_64.AppImage
          echo "APP=$PWD/dist/r00tvpn_x86_64.AppImage" >> "$GITHUB_ENV"
          echo "FLAGS=--appimage" >> "$GITHUB_ENV"
      # Separate dbus session: the system proxy test writes gsettings there, not to the runner
      - name: Smoke test (import, nodes, modes, system proxy, TUN, logs, connections)
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" node e2e/smoke.mjs "$APP" --tun $FLAGS
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.package }}
          path: e2e-artifacts

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build, e2e-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/set-version.sh
      # latest.yml is what the in-app updater polls; changelog.md becomes the release notes
      - run: pnpm updater
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: r00tvpn ${{ env.VERSION }}
          body_path: changelog.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: |
            latest.yml
            dist/*
